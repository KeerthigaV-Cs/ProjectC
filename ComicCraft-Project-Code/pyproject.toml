[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comiccraft"
version = "0.1.0"
description = "A web app for creating personalized AI comic stories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "fpdf2>=2.8,<3",
    "google-genai>=2.3.0,<3",
    "huggingface_hub>=0.25,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pillow>=10,<13",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comiccraft = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/fonts/*.ttf", "static/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"